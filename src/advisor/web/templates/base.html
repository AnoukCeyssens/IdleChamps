<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Idle Champions Advisor{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
  <style>
    :root { --fg: #1d1d1f; --muted: #8a8a8e; --bg: #fafafa; --line: #e3e3e6; --accent: #3b5bdb; }
    body { margin: 0; font: 15px/1.4 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
    header { padding: 12px 16px; border-bottom: 1px solid var(--line); background: #fff; }
    header a { color: inherit; text-decoration: none; font-weight: 600; }
    main { padding: 16px; max-width: 960px; margin: 0 auto; }
    .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .filters a { padding: 3px 10px; border: 1px solid var(--line); border-radius: 12px; color: var(--fg); text-decoration: none; }
    .filters a.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    ul.champions { list-style: none; padding: 0; margin: 0; }
    li.champion { display: flex; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); }
    li.champion .name { font-weight: 600; min-width: 11em; }
    li.champion .tags { color: var(--muted); margin-left: auto; }
    li.champion.unowned { color: var(--muted); }
    li.champion.unowned .name { font-weight: 400; }
  </style>
</head>
<body hx-boost="true">
  <header><a href="/champions">Idle Champions Advisor</a></header>
  <main>{% block main %}{% endblock %}</main>
</body>
</html>
